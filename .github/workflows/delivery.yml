name: Delivery validation and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric release version, for example 1.0.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      # Verify an existing signed main artifact with the real CLI. This job
      # receives no signing permissions and does not attest the PR checkout.
      - name: Verify real signed fixture and rejection cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python check_provenance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance-integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/provenance-integration/
          retention-days: 14
          if-no-files-found: error
      - run: python rehearse.py
      # Observe real loopback HTTP responses from verified local packages. The
      # harness owns disposable workers and never uses a cloud deployment target.
      - run: python failure_demo.py --output-dir reports/failure-demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/failure-demo/
          retention-days: 14
          if-no-files-found: error
      - run: docker build -t delivery-demo .
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
  release:
    # Untrusted PRs cannot reach this release job. Input is passed through env,
    # then validated by Python, never interpolated into shell source text.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [test, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build immutable source package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python delivery.py build --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"
      - name: Attest the exact release ZIP
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.zip
          create-storage-record: false
      - name: Verify provenance and exercise rejection cases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # Preserve the original Sigstore bundle alongside the signed bytes.
          cp "$BUNDLE_PATH" dist/provenance.jsonl
          gh version
          packages=(dist/*.zip)
          test "${#packages[@]}" -eq 1
          digest=$(cat "${packages[0]}.sha256")
          python provenance_demo.py "${packages[0]}" --sha256 "$digest" --commit "$SOURCE_COMMIT" --bundle dist/provenance.jsonl --output dist/provenance-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
