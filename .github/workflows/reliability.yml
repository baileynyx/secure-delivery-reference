name: Local reliability lab
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reliability:
    # Exercise the documented local command on both supported desktop families.
    # No cloud credentials, release signing permissions or external targets exist.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify alert decisions and HTTP recovery
        run: python -m unittest discover -s tests -p test_reliability_lab.py -v
      - name: Capture a paced reliability incident
        run: python reliability_lab.py --output-dir reports/reliability-lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reliability-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/reliability-lab/
          if-no-files-found: error
          retention-days: 14
